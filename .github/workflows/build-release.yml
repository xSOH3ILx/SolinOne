name: SolinOne CI/CD - Build & Release

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Official Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p release_dist
          cp app/build/outputs/apk/release/app-release.apk release_dist/SolinOne.apk
          
          # Verify signature or apply apksigner if not signed
          if ! $ANDROID_HOME/build-tools/35.0.0/apksigner verify release_dist/SolinOne.apk 2>/dev/null; then
            echo "Signing with apksigner fallback..."
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks keystore/solinone-release.jks --ks-key-alias solinone --ks-pass pass:SolinOne@Release2026 --key-pass pass:SolinOne@Release2026 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true release_dist/SolinOne.apk
          fi
          
          echo "=== Verifying Final APK Signature ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose release_dist/SolinOne.apk

      - name: Upload Official Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolinOne-Official-APK
          path: release_dist/SolinOne.apk

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SolinOne ${{ github.ref_name }}"
          files: |
            release_dist/SolinOne.apk
          generate_release_notes: true
